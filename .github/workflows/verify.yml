name: Go verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Check formatting
        run: test -z "$(gofmt -l api/profiles/index.go api/scan/index.go devserver.go)"
      - name: Vet
        run: go vet ./api/...
      - name: Test
        run: go test ./...
